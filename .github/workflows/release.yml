name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Build once
        run: python -m build
      - name: Twine
        run: python -m twine check dist/*
      - name: SHA256SUMS and versioned release notes
        run: |
          set -euo pipefail
          python scripts/render_release_notes.py --root . --dist dist --output /tmp/release-notes.md
          test -f /tmp/release-notes.md
          test -f dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Upload the same bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create GitHub release with the same artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="/tmp/release-notes.md"
          if [ ! -f "$NOTES" ]; then
            echo "error: rendered release notes missing; refusing gh release create"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file "$NOTES"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the same build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Isolate wheel and sdist for PyPI
        run: |
          set -euo pipefail
          mkdir -p publish
          mv dist/*.whl dist/*.tar.gz publish/
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
