name: NoEllipsis SARIF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  noellipsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Scan (keep going so SARIF can upload)
        id: scan
        continue-on-error: true
        run: |
          set +e
          noellipsis check . --format sarif > noellipsis.sarif
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          python -c "import json; json.load(open('noellipsis.sarif'))"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: noellipsis.sarif
      - name: Fail if the scanner reported findings or errors
        run: |
          test "${{ steps.scan.outputs.exit }}" = "0"
