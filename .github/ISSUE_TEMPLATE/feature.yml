name: Feature
description: Propose a local, deterministic enhancement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Must stay offline, stdlib-only at runtime, and never execute scanned code.
    validations:
      required: true
