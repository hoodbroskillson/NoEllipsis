name: Bug
description: Something NoEllipsis did incorrectly or crashed on
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal file
      description: Paste a short file that reproduces the issue. Do not include secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: noellipsis --version
    validations:
      required: true
