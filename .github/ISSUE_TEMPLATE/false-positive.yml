name: False positive
description: A finding that should not have been reported
title: "[false-positive] "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: NE002
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Minimal file
      description: The smallest snippet that is flagged incorrectly.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this is intentional
    validations:
      required: true
