name: NoEllipsis
description: Scan a repository for incomplete or truncated LLM-generated code (local, no network).
author: hoodbroskillson
branding:
  icon: search
  color: red

inputs:
  path:
    description: File or directory to scan (check/compare). Default is the repository root.
    required: false
    default: "."
  command:
    description: "Mode: check, git-diff, or compare"
    required: false
    default: check
  mode:
    description: Alias for command (check | git-diff | compare)
    required: false
    default: ""
  fail-on:
    description: Minimum severity that fails the step (error or warning)
    required: false
    default: error
  format:
    description: Output format (text, json, github, sarif)
    required: false
    default: text
  exclude:
    description: Extra exclude globs, one per line
    required: false
    default: ""
  config:
    description: Optional extra config hint (reserved; pyproject.toml is auto-discovered)
    required: false
    default: ""
  against:
    description: Original file for compare mode
    required: false
    default: ""
  staged:
    description: For git-diff, inspect staged changes only
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install NoEllipsis from the action checkout
      shell: bash
      run: python -m pip install --disable-pip-version-check "${GITHUB_ACTION_PATH}"
    - name: Run NoEllipsis
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_STAGED: ${{ inputs.staged }}
      run: python "${GITHUB_ACTION_PATH}/action/run.py"
