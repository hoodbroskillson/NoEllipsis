name: NoEllipsis
description: Scan a repository for incomplete or truncated LLM-generated code (local, no network).
author: hoodbroskillson
branding:
  icon: search
  color: red

inputs:
  path:
    description: File or directory to scan (check/compare). Default is the repository root.
    required: false
    default: "."
  command:
    description: "Mode: check, git-diff, or compare. Empty falls back to mode, then check."
    required: false
    default: ""
  mode:
    description: Alias for command (check | git-diff | compare). Empty unless set.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that fails the step (error or warning)
    required: false
    default: error
  format:
    description: Output format (text, json, github, sarif)
    required: false
    default: text
  exclude:
    description: Extra exclude globs, one per line
    required: false
    default: ""
  config:
    description: Path to a TOML file with [tool.noellipsis] (passed as --config)
    required: false
    default: ""
  against:
    description: Original file for compare mode
    required: false
    default: ""
  staged:
    description: For git-diff, inspect staged changes only
    required: false
    default: "false"
  sarif-file:
    description: When format is sarif, write validated SARIF 2.1.0 bytes here
    required: false
    default: noellipsis.sarif

outputs:
  sarif-file:
    description: Absolute path of the written SARIF file (empty unless format is sarif)
    value: ${{ steps.run.outputs.sarif-file }}
  exit-code:
    description: Exit code from the NoEllipsis process
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install NoEllipsis from the action checkout
      shell: bash
      run: python -m pip install --disable-pip-version-check "${GITHUB_ACTION_PATH}"
    - name: Run NoEllipsis
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_STAGED: ${{ inputs.staged }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: python "${GITHUB_ACTION_PATH}/action/run.py"
