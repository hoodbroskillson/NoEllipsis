[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noellipsis"
version = "1.0.0"
description = "Detect incomplete or dangerously truncated LLM-generated code before paste, commit, or deploy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hoodbroskillson" }]
requires-python = ">=3.11"
keywords = ["llm", "code-review", "cli", "static-analysis", "placeholders"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
noellipsis = "noellipsis.cli:main"

[project.urls]
Homepage = "https://github.com/hoodbroskillson/NoEllipsis"
Repository = "https://github.com/hoodbroskillson/NoEllipsis"
Issues = "https://github.com/hoodbroskillson/NoEllipsis/issues"
Changelog = "https://github.com/hoodbroskillson/NoEllipsis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=noellipsis --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/noellipsis"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["examples", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.noellipsis]
shrink-threshold = 40
fail-on = "error"
exclude = ["vendor/**", "generated/**"]
disable = []
